<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultra Pro++ Light On/Off</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">LightMaster 🔥</div>
    <ul class="nav-links">
      <li><a href="#">Home</a></li>      
    </ul>
  </nav>

  <div class="container">
    <h1>💡 Welcome , Here Light Control Panel</h1>

    <img id="light" src="https://www.w3schools.com/js/pic_bulboff.gif" alt="Light Bulb">

    <div class="button-group">
      <button class="btn on" onclick="turnOn()">Turn On</button>
      <button class="btn off" onclick="turnOff()">Turn Off</button>
    </div>

    <p class="description">
        This is a simple light control panel. Click the buttons to turn the light on or off. The light bulb image will change accordingly.  
        
    </p>
  </div>

  <script src="script.js"></script>
</body>
</html>
